# --- Bluetooth: CENTRAL role (we connect to the GoPro, we don't
#     advertise ourselves) ---
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
#CONFIG_BT_LOG_LEVEL_DBG=y
#CONFIG_LOG_MODE_ASYNC=y

# Debug: turn silent __ASSERT_NO_MSG()/MPSL asserts into a real
# "ASSERTION FAIL @ file:line" message on the console instead of
# undefined behavior - see the bt_enable() hang investigation.
CONFIG_ASSERT=y

# Debug: hardware watchdog to auto-recover from (and confirm) a real
# CPU lockup in bt_enable(), plus hwinfo to log the reset cause.
CONFIG_WATCHDOG=y
#CONFIG_WDT_LOG_LEVEL_DBG=y
CONFIG_HWINFO=y

# Bonding (persistent pairing) - required to talk to the GoPro
CONFIG_BT_SIGNING=n
#CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_DEVICE_NAME="GoProRemote"
#CONFIG_BT_CENTRAL=y
#CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=n
#CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y


#CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=y
#CONFIG_LOG_MODE_IMMEDIATE=y
#CONFIG_LOG_MODE_ASYNC=y

# Notify the app of the remote's LE feature set (populated from the
# Feature Exchange procedure - see connected()/remote_info_available()
# in ble_gopro.c) via the remote_info_available connection callback.
# Without this, the Feature Exchange still happens (it's mandatory LL
# behavior, handled entirely by the controller/host below any app
# code) but the result is silently discarded instead of reaching us.
CONFIG_BT_REMOTE_INFO=y

# d'apres Gemini :
#CONFIG_BT=y
#CONFIG_BT_CENTRAL=y
#CONFIG_BT_SMP=y
#CONFIG_BT_GATT_CLIENT=y
#CONFIG_BT_SMP_SC_PAIR_ONLY=n


# --- Only one BLE link active at a time: our GoPro ---
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4

# --- GPIO (buttons) ---
CONFIG_GPIO=y

# --- ADC (thermistor / battery measurement later) ---
CONFIG_ADC=y

# --- Sensor subsystem (nRF52 internal die temperature) ---
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y

# --- ANT+ (Garmin Edge temperature broadcast) ---
# Requires the sdk-ant add-on module in this workspace's west manifest
# (gated repo, ANT+ Adopter + GitHub org access needed - see
# doc/gopro_garmin_remote_specs.md, "ANT+ implementation notes"). Not
# fetchable from this dev sandbox (confirmed via `git ls-remote`, see
# ant_garmin.c) - add it to your own workspace manifest before building.


CONFIG_ANT=y
CONFIG_ANT_EVALUATION_KEY=y
# CONFIG_ANT_LIBRARY_CORE=y
# CONFIG_ANT_CHANNEL_CONFIG=y
# CONFIG_ANT_KEY_MANAGER=y

# Free evaluation key: fine for prototyping/testing. Swap for
# CONFIG_ANT_LICENSE_KEY (paid, per-unit royalty) before shipping a
# commercial product - see the "Licensing & cost" section of the specs
# doc.
# CONFIG_ANT_EVALUATION_KEY=y

# --- Logs over the dongle's USB CDC-ACM port (handy for debugging) ---
#CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_DEVICE_PRODUCT="My USB device"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_PID=0x0001
#CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y

CONFIG_LOG=y

# --- Misc ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2200
# Désactiver la Flash externe QSPI si non présente

CONFIG_MPU_ALLOW_FLASH_WRITE=y
# Désactiver la Flash externe QSPI si non présente
CONFIG_SPI=n
CONFIG_NORDIC_QSPI_NOR=n

# Forcer l'utilisation de la Flash Interne (Non-Volatile Storage)
CONFIG_SETTINGS_NVS=y
