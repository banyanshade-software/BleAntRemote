# --- Bluetooth : role CENTRAL (on se connecte a la GoPro, on n'est pas
#     annonce nous-memes) ---
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
# Bonding (pairing persistant) - obligatoire pour parler a la GoPro
CONFIG_BT_SIGNING=n
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_DEVICE_NAME="GoProRemote"

#CONFIG_BT_CENTRAL=y
#CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_LOG_LEVEL_DBG=y


# --- Un seul lien BLE actif a la fois : notre GoPro ---
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4

# --- GPIO (boutons) ---
CONFIG_GPIO=y

# --- ADC (thermistance / mesure batterie plus tard) ---
CONFIG_ADC=y

# --- Logs sur le port USB CDC-ACM du dongle (pratique pour debug) ---
#CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_DEVICE_PRODUCT="My USB device"
#CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_PID=0x0001
#CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y

CONFIG_LOG=y

# --- Divers ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
