# --- Bluetooth: CENTRAL role (we connect to the GoPro, we don't
#     advertise ourselves) ---
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
# Bonding (persistent pairing) - required to talk to the GoPro
CONFIG_BT_SIGNING=n
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_DEVICE_NAME="GoProRemote"

#CONFIG_BT_CENTRAL=y
#CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_LOG_LEVEL_DBG=y

# d'apres Gemini :
#CONFIG_BT=y
#CONFIG_BT_CENTRAL=y
#CONFIG_BT_SMP=y
#CONFIG_BT_GATT_CLIENT=y
#CONFIG_BT_SMP_SC_PAIR_ONLY=n


# --- Only one BLE link active at a time: our GoPro ---
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4

# --- GPIO (buttons) ---
CONFIG_GPIO=y

# --- ADC (thermistor / battery measurement later) ---
CONFIG_ADC=y

# --- Logs over the dongle's USB CDC-ACM port (handy for debugging) ---
#CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_DEVICE_PRODUCT="My USB device"
#CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_PID=0x0001
#CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y

CONFIG_LOG=y

# --- Misc ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
